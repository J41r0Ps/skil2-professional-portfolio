server {
    listen 80;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain model/gltf+json application/octet-stream;

    # --- security headers (inherited by locations without their own add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS is only honored over HTTPS (e.g. behind the Azure TLS endpoint)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # frame-ancestors replaces X-Frame-Options; style/font allow Google Fonts;
    # connect-src allows the EmailJS API for the (currently disabled) contact form
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # long-lived cache for fingerprinted/static assets
    # NOTE: add_header here resets inherited headers, so nosniff is repeated
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|glb|gltf|bin)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
